[project]
name = "irs-public-retrieval-eval"
version = "0.1.0"
description = "Optional Phoenix agent-through-MCP evaluation"
requires-python = ">=3.11"
dependencies = [
    "arize-phoenix>=21.0.0",
    "arize-phoenix-client>=3.7.0",
    "arize-phoenix-evals>=3.10.0",
    "arize-phoenix-otel>=0.17.3",
    "pydantic-ai-slim[openai,mcp]>=2.68.0",
    "opentelemetry-exporter-otlp>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "python-dotenv>=1.2.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
ibm = ["ibm-watsonx-ai>=1.9.1", "litellm>=1.106.2"]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.6.0"]

[tool.uv]
package = false
